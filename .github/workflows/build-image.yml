name: Build Image

# Baut das Container-Image bei jedem Push auf main und legt es als privates
# Package in der GitHub Container Registry ab. Der Build läuft ausschließlich
# hier, nie auf dem Server. Anschließend deployt deploy.yml den frisch gebauten
# SHA-Tag auf die VPS (#22).

on:
  push:
    branches: [main]
  workflow_dispatch:

# Läufe auf demselben Ref serialisieren, aber nicht abbrechen: jeder Merge
# soll sein SHA-getaggtes Image bekommen, sonst fehlt genau der Rollback-Anker
# auf einen Commit, der kurz vor dem nächsten Merge lag.
concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Eine Quelle für Push-Ziel und Aufräumschritt - laufen die auseinander,
  # räumt der Workflow lautlos das falsche Package auf.
  IMAGE_NAME: ${{ github.event.repository.name }}

jobs:
  build:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.ref }}
    permissions:
      contents: read
      # Reicht für Push und Aufräumen des Packages. Kein dauerhaftes Token
      # nötig - der Runner bekommt GITHUB_TOKEN pro Lauf.
      packages: write
    steps:
      - uses: actions/checkout@v7

      # docker-container-Driver, sonst greift der GitHub-Actions-Layer-Cache nicht.
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags und Labels bestimmen
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          # sha-<kurzer Commit-SHA> ist der Rollback-Anker, auf den Dokploy
          # zeigt. latest ist nur Bequemlichkeit für manuelle Pulls und deshalb
          # an main gebunden: ein manueller Lauf auf einem Branch darf kein
          # ungeprüftes Image unter latest schieben. Sein SHA-Tag ist harmlos,
          # weil er den Commit benennt, aus dem er stammt.
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build und Push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Enthält org.opencontainers.image.source - darüber verknüpft GHCR
          # das Package mit diesem Repository, und erst dadurch darf
          # GITHUB_TOKEN unten alte Versionen löschen.
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_GTM_ID=${{ vars.NEXT_PUBLIC_GTM_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Ohne das legt buildx pro Push ein zusätzliches Attestation-Manifest
          # als eigene Package-Version an - die Retention unten würde dann
          # Images statt Attestations zählen.
          provenance: false

      # Der Deploy referenziert genau den Tag, den dieser Lauf gepusht hat -
      # abgelesen aus der Ausgabe von metadata-action statt aus einer zweiten,
      # selbst gebauten Formel. Sonst zeigt der Deploy irgendwann auf einen Tag,
      # der so nie gepusht wurde.
      - name: SHA-Tag des gebauten Images bestimmen
        id: image
        env:
          META_JSON: ${{ steps.meta.outputs.json }}
        run: |
          set -euo pipefail
          ref=$(jq -er 'first(.tags[] | select(contains(":sha-")))' <<<"$META_JSON")
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Gebautes Image: $ref"

      # Fünf Versionen sind genug Rollback-Punkte, ohne dass der
      # Registry-Speicher wächst.
      #
      # Nur auf main: ein Branch-Build würde sonst Tags aus dem
      # Rollback-Fenster verdrängen - im schlimmsten Fall genau den, auf dem
      # die Produktion gerade steht.
      #
      # continue-on-error, weil der Deploy über needs: build an diesem Job
      # hängt. Ein Schluckauf der Packages-API darf kein Deployment
      # verhindern, dessen Image längst gepusht ist.
      #
      # Deklariert als einzige Action hier noch Node 20 und ist damit die
      # verbleibende Quelle der Deprecation-Warnung in diesem Workflow (#41).
      # Sie bleibt trotzdem stehen: Upstream ist eingeschlafen - letztes
      # Release 01/2024, letzter Commit 06/2025 - es gibt keinen neueren Major
      # zum Draufheben. Der Runner hebt sie auf Node 24, das Restrisiko ist
      # also nicht die Deklaration, sondern Action-Code, der auf Node 24
      # bricht. Passiert das, deckelt continue-on-error den Schaden auf einen
      # wachsenden Registry-Speicher. Ersatz wäre dann ein eigener Schritt
      # über `gh api`.
      - name: Alte Package-Versionen aufräumen
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ env.IMAGE_NAME }}
          package-type: container
          min-versions-to-keep: 5

  # needs: build heißt, dass ein fehlgeschlagener Build oder Push kein
  # Deployment auslöst. Die Einschränkung auf main verhindert, dass ein
  # manueller Lauf auf einem Branch ungeprüften Code live schiebt.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    with:
      image: ${{ needs.build.outputs.image }}
    secrets:
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
