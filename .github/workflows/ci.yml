name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    env:
      # Alle App-Env-Vars werden zur Laufzeit (Server Actions, Route
      # Handler) gelesen, nicht zur Build-Zeit. Diese Dummy-Werte sind
      # nur ein Sicherheitsnetz, damit der Build nie an fehlenden Vars
      # scheitert. Echte Secrets liegen im Panel der Hosting-Plattform,
      # nie im Repository und nie in den GitHub-Actions-Secrets.
      SUPABASE_URL: https://placeholder.supabase.co
      SUPABASE_SECRET_KEY: placeholder
      BREVO_API_KEY: placeholder
      GMAIL_USER_EMAIL: placeholder@example.com
      GMAIL_FROM_ALIAS: placeholder@example.com
      CONTACT_RECIPIENT_EMAIL: placeholder@example.com
      GOOGLE_SERVICE_ACCOUNT_EMAIL: placeholder@example.com
      GOOGLE_PRIVATE_KEY: placeholder
      GUIDE_JWT_SECRET: placeholder-placeholder-placeholder-1234
      NEXT_PUBLIC_GTM_ID: ""
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Ein Client-Provider, der children zurückhält, liefert eine Seite mit
      # HTTP 200, gültigem <title> und komplett leerem <body> (Issue #34).
      # Dieser Schritt misst deshalb das Body-Markup ohne <script>, für
      # bestehende Seiten und für tote URLs.
      #
      # Geprüft wird der Standalone-Server, nicht `next start`: next.config.ts
      # setzt `output: "standalone"`, und genau dieses Bundle läuft produktiv im
      # Container. `next start` bedient aus dem vollständigen .next-Verzeichnis
      # und sicherte damit einen Ausführungspfad ab, den niemand ausliefert -
      # ein Fehler nur im Bundle (fehlende Datei im Trace, nicht mitkopierte
      # Assets) bliebe unentdeckt (Issue #40).
      - name: Standalone-Server prüfen (Markup, 404 und Assets)
        run: |
          # Laufzeit-Layout wie im Dockerfile: .next/static und public liegen
          # nicht im Standalone-Bundle, _posts und src/content werden zur
          # Laufzeit über process.cwd() gelesen (src/lib/api.ts, guide/[chapter]).
          # Der Standalone-Server wechselt beim Start in sein eigenes
          # Verzeichnis - relativ zum Repo-Root findet er nichts davon.
          #
          # Diese vier Kopien mit dem Dockerfile zu teilen wurde geprüft und
          # verworfen: dort läuft es als `COPY --from=builder`, das kein Skript
          # aufrufen kann. Bleibt die Doppelung - ändert sich die Liste hier,
          # ändert sie sich auch im Dockerfile.
          cp -r .next/static .next/standalone/.next/static
          cp -r public _posts .next/standalone/
          mkdir -p .next/standalone/src
          cp -r src/content .next/standalone/src/content

          # Kein --port: der Standalone-Server liest nur PORT und HOSTNAME,
          # beide wie im Dockerfile. HOSTNAME ist auf manchen Runnern gesetzt
          # und würde den Server sonst an den Maschinennamen binden - die
          # Warteschleife liefe dann 60 Sekunden ins Leere.
          PORT=3000 HOSTNAME=0.0.0.0 node .next/standalone/server.js &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000/ && break
            sleep 1
          done
          npm run check:ssr -- http://localhost:3000 \
            / /blog /blog/spart-ki-wirklich-zeit \
            /ki-check-handwerk /second-brain-anleitung /kontakt /leistungen

          # Tote URLs müssen 404 liefern und trotzdem eine echte Seite zeigen
          # (Issue #28). Zwei Pfade, weil Next beide Fälle unterschiedlich
          # behandelt: nicht gematchte Route und ein Slug, den
          # generateStaticParams nicht kennt.
          npm run check:404 -- http://localhost:3000 \
            /diese-seite-gibt-es-nicht /blog/gibt-es-nicht

          # Gegenprobe zum Markup-Check: Fehlen .next/static oder public im
          # Standalone-Layout, rendert der Server weiter vollständiges Markup -
          # nur ohne CSS, JS und Bilder. Der Markup-Check allein bliebe also
          # grün. Deshalb hier je eine Datei aus dem Build-Output und aus public.
          #
          # `|| true` fängt den leeren grep ab: ohne pipefail wäre der Status
          # der von sort und die Prüfung liefe weiter, mit pipefail bräche der
          # Schritt hier wortlos ab. So kommt in beiden Fällen die Meldung.
          assets=$(curl -sf --max-time 30 http://localhost:3000/ \
            | grep -oE '/_next/static/[^"]+\.(css|js)' | sort -u || true)
          if [ -z "$assets" ]; then
            echo "FEHLER: Startseite referenziert kein Asset unter /_next/static"
            exit 1
          fi
          failed=0
          # logo-icon.svg statt einer beliebigen Datei aus public: sie steckt in
          # der Navigation und im JSON-LD, verschwindet also nicht unbemerkt und
          # macht den Check nicht zum einzigen Grund, sie zu behalten.
          for asset in $assets /logo-icon.svg; do
            code=$(curl -s --max-time 30 -o /dev/null -w '%{http_code}' "http://localhost:3000$asset")
            if [ "$code" = "200" ]; then
              echo "ok   $asset"
            else
              echo "FAIL $asset status=$code"
              failed=$((failed + 1))
            fi
          done
          if [ "$failed" -gt 0 ]; then
            echo "$failed Assets werden nicht ausgeliefert."
            exit 1
          fi
