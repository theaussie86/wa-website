  <style>
    /* Betriebsordner, auf E-Mail übersetzt. Design: DESIGN.md im Repo-Root.
       Pappe als Grund, das Blatt als Inhaltsfläche, Blau für Kopf und Etikett,
       Orange nur als Haftnotiz. Archivo, wo der Client Webfonts lädt,
       sonst Arial Narrow für Überschriften und Arial für Fließtext. */
    :root { color-scheme: light dark; supported-color-schemes: light dark; }
    body { margin: 0; padding: 0; width: 100% !important; -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table { border-collapse: collapse; mso-table-lspace: 0; mso-table-rspace: 0; }
    a { color: #003970; }
    .display { font-stretch: 78%; letter-spacing: -0.02em; }
    .label { font-stretch: 70%; letter-spacing: 0.06em; text-transform: uppercase; }

    @media (max-width: 620px) {
      .sheet-pad { padding: 32px 24px !important; }
      .outer-pad { padding: 24px 12px !important; }
      .h1 { font-size: 30px !important; }
      .button a { display: block !important; }
    }

    @media (prefers-color-scheme: dark) {
      .bg-pappe { background-color: #11161B !important; }
      .bg-sheet { background-color: #1C242C !important; }
      .c-primary { color: #A9C8EC !important; }
      .c-text { color: #E3E7EA !important; }
      .c-muted { color: #A3ACB4 !important; }
      .bg-button { background-color: #2B63A0 !important; }
      .bg-note { background-color: #3A2A1A !important; }
      .c-note { color: #F6D9BC !important; }
      .rule { border-color: #2E3943 !important; }
    }
    [data-ogsc] .c-primary { color: #A9C8EC !important; }
    [data-ogsc] .c-text { color: #E3E7EA !important; }
    [data-ogsc] .c-muted { color: #A3ACB4 !important; }
    [data-ogsb] .bg-pappe { background-color: #11161B !important; }
    [data-ogsb] .bg-sheet { background-color: #1C242C !important; }
    [data-ogsb] .bg-button { background-color: #2B63A0 !important; }
    [data-ogsb] .bg-note { background-color: #3A2A1A !important; }
    [data-ogsc] .c-note { color: #F6D9BC !important; }
  </style>
</head>
<body class="bg-pappe" style="margin: 0; padding: 0; background-color: #E8EBEE;">

        <!--[if mso]><table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"><tr><td><![endif]-->

            </td>
          </tr>

          <tr>

%%CONTENT%%
            </td>
          </tr>

          <tr>
            <td style="padding: 22px 4px 0 4px;">

            </td>
          </tr>

        </table>
        <!--[if mso]></td></tr></table><![endif]-->

      </td>
    </tr>
